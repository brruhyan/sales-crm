services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maralabs-sales-app
    restart: unless-stopped
    env_file: ./.env
    ports:
      - "8080:80"
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - maralabs-net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: maralabs-sales-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - maralabs-net

volumes:
  db_data:
    driver: local
  storage_data:
    driver: local

networks:
  maralabs-net:
    driver: bridge
